[project]
name = "watchtogether"
version = "0.1.0"
description = "Lightweight WebSocket-based synchronized media playback engine for virtual watch parties"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["watchtogether"]

[tool.pytest.ini_options]
testpaths = ["tests"]
